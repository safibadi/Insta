name: CI and Deploy

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, and never cancel one mid-flight - a
# half-finished deploy would leave the live site broken.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Generate fixtures
        run: python3 tests/make-fixtures.py

      - name: Unit tests (parsing and analysis)
        run: node tests/run-unit.mjs

      - name: End-to-end tests (real browser, incl. the no-network assertion)
        run: node tests/run-e2e.mjs

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: tests/screenshot-*.png
          if-no-files-found: ignore

  deploy:
    name: Deploy to GitHub Pages
    needs: test
    # Publishes from main. Deliberately not keyed to the repository's default
    # branch setting: this repo was created empty, so GitHub made whichever
    # branch was pushed first the default, which is not the branch we release
    # from.
    # Any trigger but a pull request may publish, so a deploy can be re-run by
    # hand from the Actions tab without needing a commit to push it along.
    if: github.ref_name == 'main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement: true turns Pages on via the API on the first run, so the
      # only manual setup left is choosing the source in repo settings - and
      # not even that, since a workflow-built artifact implies it.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # There is no build step - the site is plain HTML, CSS and ES modules.
      # Staged into a clean directory so the test harness and CI config aren't
      # published alongside it.
      - name: Stage site files
        run: |
          mkdir -p _site
          cp -r index.html assets .nojekyll _site/
          cp README.md LICENSE _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
